services:
  qdrant:
    image: qdrant/qdrant:v1.16.2
    container_name: fda-rag-qdrant
    ports:
      - "6333:6333"
    volumes:
      - D:/qdrant/storage:/qdrant/storage
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fda-rag-backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - qdrant
    restart: unless-stopped
